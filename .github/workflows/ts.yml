name: ts

on:
  push:
    branches:
      - master
      - lab
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/package.json"
      - "**/tsconfig*.json"
      - "bun.lockb"
      - ".github/workflows/ts.yml"
  pull_request:
    branches:
      - master
      - lab
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/package.json"
      - "**/tsconfig*.json"
      - "bun.lockb"
      - ".github/workflows/ts.yml"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/checkout@v2
      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: "install dependencies"
        run: bun install --frozen-lockfile
      - name: "run lint"
        run: "bun run lint"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/checkout@v2
      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: "install dependencies"
        run: bun install --frozen-lockfile
      - name: "run build"
        run: "bun run build"
      - name: "run test"
        run: "bun run test"
